<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQRS - Sistema de Peticiones</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc 0%, #00b4d8 100%);
        }
        .auth-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }
        .auth-logo { font-size: 80px; margin-bottom: 30px; opacity: 0.9; }
        .auth-title { font-size: 3rem; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .auth-subtitle { font-size: 1.25rem; opacity: 0.9; text-align: center; max-width: 400px; line-height: 1.8; }
        .auth-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: var(--gray-50);
        }
        .auth-form-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 40px;
        }
        .auth-form-title { font-size: 1.75rem; font-weight: 700; color: var(--gray-900); margin-bottom: 10px; }
        .auth-form-subtitle { color: var(--gray-500); margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 1rem; transition: all 0.2s ease; }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .btn-login {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,102,204,0.4);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,102,204,0.6); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid var(--gray-200); }
        .auth-tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer;
            font-weight: 600; color: var(--gray-500);
            border: none; background: none;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease; margin-bottom: -2px;
        }
        .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .auth-tab-content { display: none; }
        .auth-tab-content.active { display: block; }
        @media (max-width: 1024px) { .auth-left { display: none; } .auth-right { flex: 1; } }
        @media (max-width: 600px) { .auth-right { padding: 20px; } .auth-form-container { padding: 30px 20px; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-logo">📋</div>
            <h1 class="auth-title">PQRS</h1>
            <p class="auth-subtitle">Sistema de Peticiones, Quejas, Reclamaciones y Sugerencias</p>
        </div>

        <div class="auth-right">
            <div class="auth-form-container">

                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login', this)">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>
                    <button class="auth-tab" onclick="switchTab('register', this)">
                        <i class="fas fa-user-plus"></i> Registrarse
                    </button>
                </div>

                <div id="alertBox" style="display:none;"></div>

                <!-- Login -->
                <div id="login" class="auth-tab-content active">
                    <h2 class="auth-form-title">Bienvenido</h2>
                    <p class="auth-form-subtitle">Ingresa tu correo y contraseña</p>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="correo">Correo</label>
                            <input type="email" id="correo" placeholder="tu@correo.com" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-login" id="btnLogin">
                            <i class="fas fa-arrow-right"></i> Ingresar
                        </button>
                    </form>
                </div>

                <!-- Registro -->
                <div id="register" class="auth-tab-content">
                    <h2 class="auth-form-title">Crear Cuenta</h2>
                    <p class="auth-form-subtitle">Únete al sistema PQRS</p>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" placeholder="Tu apellido" required>
                        </div>
                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" placeholder="+57 300 000 0000" required>
                        </div>
                        <div class="form-group">
                            <label for="regCorreo">Correo</label>
                            <input type="email" id="regCorreo" placeholder="tu@correo.com" required>
                        </div>
                        <div class="form-group">
                            <label for="regPassword">Contraseña</label>
                            <input type="password" id="regPassword" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-login" id="btnRegister">
                            <i class="fas fa-user-plus"></i> Registrarse
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
